[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-cartographer"
version = "0.2.0"
description = "Revision-aware Python repository impact analysis"
requires-python = ">=3.9,<3.13"
dependencies = ["tree-sitter==0.23.2", "tree-sitter-python==0.23.6", "fastapi==0.128.0", "uvicorn==0.39.0"]

[project.optional-dependencies]
ml = ["torch==2.8.0", "numpy==2.0.2", "scikit-learn==1.6.1", "xgboost==2.1.4", "transformers==4.46.3", "faiss-cpu==1.9.0.post1"]
test = ["httpx==0.28.1"]

[project.scripts]
neural-cartographer = "neural_cartographer.cli.start:main"

[tool.setuptools.packages.find]
where = ["backend/src"]
